[package]
name = "rustdiff"
version = "0.6.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
html-escape = "0.2.15"
memchr = "2.8.3"
memmap2 = "0.9.11"
rapidhash = "4.5.1"
rayon = { version = "1.12.0", optional = true }
regex = "1.13.1"
smallvec = "1.15.2"

[features]
default = []
parallel = ["dep:rayon"]

[dev-dependencies]
criterion = "0.8.2"
dhat = "0.3.3"
proptest = "1.11.0"

[[bench]]
name = "diff_bench"
harness = false

[profile.release]
strip = true
panic = "abort"
overflow-checks = false
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false

[profile.dist]
inherits = "release"
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
debug = false
