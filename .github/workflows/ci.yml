name: rustdiff CI

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint, Test & Docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: clippy, rustfmt

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Lint (clippy)
        run: cargo clippy --locked --all-targets -- -D warnings -W clippy::pedantic -W clippy::nursery

      - name: Run tests
        run: cargo test --locked --all-targets --verbose

      - name: Build docs
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --no-deps

  features:
    name: Feature Matrix (${{ matrix.features }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        features: ["--no-default-features", "--all-features"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: clippy

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2

      - name: Check with ${{ matrix.features }}
        run: cargo check --locked ${{ matrix.features }}

      - name: Clippy with ${{ matrix.features }}
        run: cargo clippy --locked --all-targets ${{ matrix.features }} -- -D warnings -W clippy::pedantic -W clippy::nursery

      - name: Test with ${{ matrix.features }}
        run: cargo test --locked ${{ matrix.features }}

  msrv:
    name: MSRV Check (1.97.0)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2

      - name: Check at declared MSRV
        run: cargo check --locked

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit

  build:
    name: Build Optimized Binary
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          targets: "x86_64-unknown-linux-gnu"

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --locked --profile dist --target x86_64-unknown-linux-gnu

      - name: Rename and smoke test binary
        run: |
          cd target/x86_64-unknown-linux-gnu/dist
          cp rustdiff rustdiff-${{ github.ref_name }}-linux-x86_64
          chmod +x rustdiff-${{ github.ref_name }}-linux-x86_64
          ./rustdiff-${{ github.ref_name }}-linux-x86_64 --version
          echo "hello" > /tmp/a.txt
          echo "world" > /tmp/b.txt
          ./rustdiff-${{ github.ref_name }}-linux-x86_64 /tmp/a.txt /tmp/b.txt --summary

      - name: Strip symbols before compression
        run: strip target/x86_64-unknown-linux-gnu/dist/rustdiff-${{ github.ref_name }}-linux-x86_64

      - name: Compress with UPX
        run: |
          sudo apt-get update && sudo apt-get install -y upx
          upx --best --lzma target/x86_64-unknown-linux-gnu/dist/rustdiff-${{ github.ref_name }}-linux-x86_64 || true

      - name: Generate SHA256 checksum
        run: |
          cd target/x86_64-unknown-linux-gnu/dist
          sha256sum rustdiff-${{ github.ref_name }}-linux-x86_64 > rustdiff-${{ github.ref_name }}-linux-x86_64.sha256

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: rustdiff-linux-x86_64
          path: |
            target/x86_64-unknown-linux-gnu/dist/rustdiff-${{ github.ref_name }}-linux-x86_64
            target/x86_64-unknown-linux-gnu/dist/rustdiff-${{ github.ref_name }}-linux-x86_64.sha256

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
